version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: srimaata
      POSTGRES_PASSWORD: srimaata_pass
      POSTGRES_DB: srimaata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://srimaata:srimaata_pass@db:5432/srimaata
      - RAZORPAY_KEY=
      - RAZORPAY_SECRET=
    depends_on:
      - db

volumes:
  db_data:
