<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — SriMaata</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h2>Appointments</h2>
    <div id="list">Loading...</div>
  </div>
  <script>
    async function load(){
      const res = await fetch('/api/appointments');
      const data = await res.json();
      const el = document.getElementById('list');
      if(!data.length) el.innerHTML='<p>No appointments yet</p>';
      else{
        el.innerHTML = '<ul>' + data.map(a=>`<li><strong>${a.name}</strong> — ${a.email} — ${a.date} ${a.time} <div>${a.notes||''}</div></li>`).join('') + '</ul>'
      }
    }
    load();
  </script>
</body>
</html>
